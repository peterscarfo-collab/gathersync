<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanks - GatherSync</title>
    <meta name="description" content="Thanks for contacting GatherSync. We will follow up shortly." />
    <style>
      :root {
        --color-primary: #0071e3;
        --color-text: #1d1d1f;
        --color-text-secondary: #66666b;
        --color-bg: #ffffff;
        --color-border: #d2d2d7;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: var(--font-sans); color: var(--color-text); background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px; }
      .card { max-width: 560px; background: #fff; border: 1px solid var(--color-border); border-radius: 22px; padding: 28px; }
      .eyebrow { font-size: 14px; color: var(--color-primary); font-weight: 600; margin-bottom: 12px; }
      h1 { font-size: 28px; line-height: 1.2; margin-bottom: 16px; }
      p { color: var(--color-text-secondary); margin-bottom: 24px; }
      .btn-primary { display: inline-flex; padding: 14px 28px; border-radius: 999px; background: var(--color-primary); color: #fff; font-size: 17px; text-decoration: none; }
      .btn-primary:hover { background: #0077ed; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Submission received</p>
      <h1>Thanks for contacting GatherSync.</h1>
      <p>We received your message and will reach out shortly with next steps.</p>
      <a href="/" class="btn-primary">Back to app</a>
    </main>
  </body>
</html>
