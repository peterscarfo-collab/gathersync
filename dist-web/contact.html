<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - GatherSync</title>
    <meta name="description" content="Contact GatherSync for support, onboarding help, and next steps." />
    <style>
      :root {
        --color-primary: #0071e3;
        --color-primary-hover: #0077ed;
        --color-text: #1d1d1f;
        --color-text-secondary: #66666b;
        --color-bg: #ffffff;
        --color-bg-secondary: #f5f5f7;
        --color-border: #d2d2d7;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: var(--font-sans); color: var(--color-text); background: var(--color-bg); line-height: 1.5; font-size: 17px; -webkit-font-smoothing: antialiased; min-height: 100vh; }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
      .nav { position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,0.08); }
      .nav-content { display: flex; justify-content: space-between; align-items: center; min-height: 56px; gap: 16px; }
      .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--color-text); text-decoration: none; font-weight: 600; }
      .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--color-primary); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
      .logo-text { font-size: 20px; }
      .nav-links { display: flex; align-items: center; gap: 20px; }
      .nav-links a { font-size: 14px; color: var(--color-text); text-decoration: none; }
      .btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 999px; background: var(--color-primary); color: #ffffff !important; font-size: 14px; text-decoration: none; border: none; cursor: pointer; transition: background 0.2s; }
      .btn-primary:hover { background: var(--color-primary-hover); color: #ffffff !important; }
      .contact { padding: 88px 0; }
      .contact-content { display: grid; gap: 30px; grid-template-columns: 1fr 1fr; }
      @media (max-width: 768px) { .contact-content { grid-template-columns: 1fr; } }
      .contact-info h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 12px; }
      .contact-info p { color: var(--color-text-secondary); margin: 12px 0 14px; }
      .contact-item { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--color-border); padding: 8px 12px; font-size: 14px; }
      .contact-form { background: var(--color-bg-secondary); border-radius: 20px; padding: 20px; }
      .form-group { margin-bottom: 14px; }
      .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
      .form-group input, .form-group textarea { width: 100%; border: 1px solid var(--color-border); border-radius: 12px; padding: 10px 12px; font-size: 16px; font-family: var(--font-sans); }
      .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--color-primary); }
      .form-note { margin-top: 10px; font-size: 14px; color: var(--color-text-secondary); }
      .btn-block { width: 100%; padding: 14px; font-size: 16px; }
      button.btn-primary { color: #ffffff !important; -webkit-text-fill-color: #ffffff; }
      .footer { background: var(--color-bg-secondary); padding: 48px 0 24px; margin-top: 48px; }
      .footer-bottom { text-align: center; padding-top: 24px; font-size: 14px; color: var(--color-text-secondary); }
      .back-link { margin-top: 24px; display: inline-block; color: var(--color-primary); text-decoration: none; font-size: 15px; }
      .back-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <nav class="nav">
      <div class="container nav-content">
        <a class="logo" href="/" aria-label="GatherSync home">
          <span class="logo-mark" aria-hidden="true">GS</span>
          <span class="logo-text">GatherSync</span>
        </a>
        <div class="nav-links">
          <a href="/" class="btn-primary">Back to app</a>
        </div>
      </div>
    </nav>

    <section class="contact">
      <div class="container contact-content">
        <div class="contact-info">
          <h2>Contact us</h2>
          <p>
            Tell us about your group and we will follow up with support, onboarding help, and next
            steps.
          </p>
          <div class="contact-item">hello@gathersync.app</div>
        </div>
        <form
          class="contact-form"
          id="contactForm"
          name="contact"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
          action="/contact-success.html"
        >
          <input type="hidden" name="form-name" value="contact" />
          <p style="display: none">
            <label>Don't fill this out if you're human: <input name="bot-field" /></label>
          </p>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" required placeholder="Tell us how we can help."></textarea>
          </div>
          <button type="submit" class="btn-primary btn-block">Send Message</button>
          <p class="form-note">
            We only use this information to respond to your message.
          </p>
        </form>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <a href="/" class="back-link">← Back to app</a>
        <div class="footer-bottom">
          <p>© <span id="year"></span> GatherSync. All rights reserved.</p>
        </div>
      </div>
    </footer>
    <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
  </body>
</html>
